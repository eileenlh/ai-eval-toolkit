:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {

  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:

.form-select:not(:disabled):hover {

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

.form-range {

  height: 28px;

.form-range::-webkit-slider-thumb {
  appearance: none;

  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;

}

  width: 20px;

.form-range:disabled {

}

&lt;div id=&quot;laef-libguide-mockup&quot;&gt;
  &lt;section class=&quot;laef-shell&quot; aria-label=&quot;LibGuide layout mockup&quot;&gt;

      &lt;button class=&quot;laef-tab&quot; type=&quot;button&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;laef-overview&quot; id=&quot;laef-tab-overview&quot; data-panel=&quot;laef-overview&quot;&gt;Overview&lt;/button&gt;

    &lt;main&gt;
      &lt;section class=&quot;laef-panel&quot; id=&quot;laef-overview&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;laef-tab-overview&quot; data-active=&quot;true&quot;&gt;
        &lt;div class=&quot;laef-page-grid&quot;&gt;
          &lt;div class=&quot;laef-main&quot;&gt;
            &lt;h2&gt;Don’t verify everything. Allocate trust first.&lt;/h2&gt;
            &lt;p class=&quot;laef-lede&quot;&gt;AI produces fluent language by predicting likely text—not by guaranteeing meaning or truth. Treat each answer as a bundle of claims, then spend your attention where the consequences are highest.&lt;/p&gt;

            &lt;section class=&quot;laef-section&quot; aria-labelledby=&quot;laef-three-questions&quot;&gt;

                  &lt;div class=&quot;laef-step-head&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;1&lt;/span&gt;&lt;h3&gt;Stakes&lt;/h3&gt;&lt;/div&gt;
                  &lt;p&gt;What happens if this claim is wrong? A cited argument or decision carries more risk than background information.&lt;/p&gt;
                &lt;/article&gt;
                &lt;article class=&quot;laef-step laef-blue&quot;&gt;
                  &lt;div class=&quot;laef-step-head&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;2&lt;/span&gt;&lt;h3&gt;Verifiability&lt;/h3&gt;&lt;/div&gt;

                &lt;article class=&quot;laef-step laef-purple&quot;&gt;
                  &lt;div class=&quot;laef-step-head&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;3&lt;/span&gt;&lt;h3&gt;Grounding&lt;/h3&gt;&lt;/div&gt;

                &lt;strong&gt;Your judgment&lt;/strong&gt;

        &lt;h2&gt;Choose the depth of checking&lt;/h2&gt;

            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Claim profile&lt;/th&gt;&lt;th&gt;Effort level&lt;/th&gt;&lt;th&gt;What to do&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;High stakes, low grounding&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;laef-tag laef-tag-deep&quot;&gt;Deep audit&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Run the full toolkit and go outside the model.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Moderate stakes, cheap to check&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;laef-tag laef-tag-quick&quot;&gt;Quick check&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Make one pass against an authority, then move on.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Low stakes, uncontested&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;laef-tag laef-tag-use&quot;&gt;Provisional use&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Accept provisionally and spend attention elsewhere.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/section&gt;
      &lt;/section&gt;

      &lt;section class=&quot;laef-panel&quot; id=&quot;laef-toolkit&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;laef-tab-toolkit&quot; data-active=&quot;false&quot; hidden&gt;
        &lt;h2&gt;The Library AI Evaluation Framework (LAEF)&lt;/h2&gt;
        &lt;p class=&quot;laef-lede&quot;&gt;LAEF is a learner-facing workflow for moving from a plausible AI answer to an accountable decision. Triage determines how deeply to investigate; the three layers determine what kind of checking to do.&lt;/p&gt;

        &lt;div class=&quot;laef-framework-note laef-section&quot;&gt;
          &lt;p&gt;&lt;strong&gt;Why three layers?&lt;/strong&gt; Four analytical dimensions sit underneath the framework: content quality, evidence quality, behavioral robustness, and risk or calibration. LAEF translates those dimensions into three actions learners can actually perform. A fourth instructional layer is not needed.&lt;/p&gt;
        &lt;/div&gt;

        &lt;section class=&quot;laef-section&quot; aria-labelledby=&quot;laef-framework-glance&quot;&gt;
          &lt;h3 id=&quot;laef-framework-glance&quot;&gt;LAEF at a glance&lt;/h3&gt;
        &lt;div class=&quot;laef-layers laef-section&quot;&gt;
            &lt;article class=&quot;laef-layer laef-green&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;1&lt;/span&gt;&lt;h3&gt;Verify source–claim fit&lt;/h3&gt;&lt;p&gt;Is the evidence real, and does it support what the AI says?&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;laef-layer laef-blue&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;2&lt;/span&gt;&lt;h3&gt;Triangulate and preserve context&lt;/h3&gt;&lt;p&gt;Does the claim remain defensible across independent evidence and the broader conversation?&lt;/p&gt;&lt;/article&gt;
            &lt;article class=&quot;laef-layer laef-purple&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;3&lt;/span&gt;&lt;h3&gt;Stress-test and judge risk&lt;/h3&gt;&lt;p&gt;Is the answer stable, appropriately uncertain, and safe enough for the task?&lt;/p&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;laef-section&quot; aria-labelledby=&quot;laef-dimensions&quot;&gt;
          &lt;h3 id=&quot;laef-dimensions&quot;&gt;How the analytical dimensions map to LAEF&lt;/h3&gt;
          &lt;div class=&quot;table-responsive&quot;&gt;
            &lt;table class=&quot;laef-practice&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;LAEF layer&lt;/th&gt;&lt;th&gt;Dimensions addressed&lt;/th&gt;&lt;th&gt;Primary function&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;1. Source Verification&lt;/td&gt;&lt;td&gt;Evidence quality + part of content quality&lt;/td&gt;&lt;td&gt;Establish that a citation is real and determine whether it supports the generated claim.&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;2. Cross-Reference&lt;/td&gt;&lt;td&gt;Content quality + evidence quality&lt;/td&gt;&lt;td&gt;Test the claim against independent evidence, compare scope and context, and preserve credible disagreement.&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;3. Model Limitations&lt;/td&gt;&lt;td&gt;Behavioral robustness + risk and calibration&lt;/td&gt;&lt;td&gt;Stress-test the answer and identify conditions under which trust in the model should decrease.&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;laef-layer-detail&quot; aria-labelledby=&quot;laef-layer-one&quot;&gt;
          &lt;div class=&quot;laef-layer-title laef-green&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;1&lt;/span&gt;&lt;h3 id=&quot;laef-layer-one&quot;&gt;Verify the source and source–claim connection&lt;/h3&gt;&lt;/div&gt;
          &lt;p class=&quot;laef-lede&quot;&gt;This layer separates two questions that AI answers often blur: “Is the claim true?” and “Does this particular source support it?” A real citation can still be irrelevant, misrepresented, too narrow, or taken out of context.&lt;/p&gt;
          &lt;div class=&quot;laef-check-grid&quot;&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;What to check&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Resolve the DOI, URL, title, or author and reach the actual source.&lt;/li&gt;
                &lt;li&gt;Confirm that the bibliographic details match.&lt;/li&gt;
                &lt;li&gt;Read the abstract, methods, findings, and limitations as needed.&lt;/li&gt;
                &lt;li&gt;Locate the exact passage or result that could support the claim.&lt;/li&gt;
                &lt;li&gt;Search more than one database before labeling a citation fabricated.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;Warning signs&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;The identifier resolves to a different publication.&lt;/li&gt;
                &lt;li&gt;The source is real, but the AI overstates or reverses its findings.&lt;/li&gt;
                &lt;li&gt;A review, commentary, or news story is presented as direct evidence.&lt;/li&gt;
                &lt;li&gt;The cited source cannot support the population, date, or causal claim given.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;p class=&quot;laef-decision-line&quot;&gt;&lt;strong&gt;Layer 1 decision:&lt;/strong&gt; Keep the citation, correct the claim, replace the source, or investigate further.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section class=&quot;laef-layer-detail&quot; aria-labelledby=&quot;laef-layer-two&quot;&gt;
          &lt;div class=&quot;laef-layer-title laef-blue&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;2&lt;/span&gt;&lt;h3 id=&quot;laef-layer-two&quot;&gt;Triangulate the claim and preserve context&lt;/h3&gt;&lt;/div&gt;
          &lt;p class=&quot;laef-lede&quot;&gt;Layer 1 checks a particular source. Layer 2 asks whether the claim survives the wider evidence landscape. The goal is not to force consensus, but to distinguish convergence, boundary conditions, and credible disagreement.&lt;/p&gt;
          &lt;div class=&quot;laef-check-grid&quot;&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;What to do&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Restate the claim precisely and separate direct support from inference.&lt;/li&gt;
                &lt;li&gt;Consult an independent source, preferably using a different method or evidence base.&lt;/li&gt;
                &lt;li&gt;Compare population, geography, period, definitions, methods, and conditions.&lt;/li&gt;
                &lt;li&gt;Look for systematic reviews, guidelines, or disciplinary consensus when appropriate.&lt;/li&gt;
                &lt;li&gt;Search for disagreement and explain it rather than averaging it away.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;Authority hierarchy&lt;/h3&gt;
              &lt;ol&gt;
                &lt;li&gt;Independent search or original source&lt;/li&gt;
                &lt;li&gt;Recent review, guideline, or consensus&lt;/li&gt;
                &lt;li&gt;Subject expert or curated resource&lt;/li&gt;
                &lt;li&gt;A second AI system—for comparison only&lt;/li&gt;
              &lt;/ol&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;p class=&quot;laef-decision-line&quot;&gt;&lt;strong&gt;Layer 2 decision:&lt;/strong&gt; Accept the claim with context, narrow it, qualify uncertainty, present competing interpretations, or reject it.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section class=&quot;laef-layer-detail&quot; aria-labelledby=&quot;laef-layer-three&quot;&gt;
          &lt;div class=&quot;laef-layer-title laef-purple&quot;&gt;&lt;span class=&quot;laef-number&quot;&gt;3&lt;/span&gt;&lt;h3 id=&quot;laef-layer-three&quot;&gt;Stress-test the model and judge the risk&lt;/h3&gt;&lt;/div&gt;
          &lt;p class=&quot;laef-lede&quot;&gt;You do not need to know the correct answer in advance to notice unreliable model behavior. Reduce trust when reasonable changes in wording, framing, or user stance produce incompatible answers without new evidence.&lt;/p&gt;
          &lt;div class=&quot;laef-check-grid&quot;&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;Stability&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Paraphrase the request while preserving its meaning.&lt;/li&gt;
                &lt;li&gt;Change formatting, order, or examples.&lt;/li&gt;
                &lt;li&gt;Test neutral, supportive, and skeptical frames.&lt;/li&gt;
                &lt;li&gt;Repeat the request and compare outputs.&lt;/li&gt;
                &lt;li&gt;Try another model or interface when the task warrants it.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;Trustworthiness&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Does confidence match the strength of the evidence?&lt;/li&gt;
                &lt;li&gt;Is a debated question presented as settled?&lt;/li&gt;
                &lt;li&gt;Does the answer flatter or follow the user’s preferred position?&lt;/li&gt;
                &lt;li&gt;Could bias, ambiguity, harmfulness, or stale training data matter?&lt;/li&gt;
                &lt;li&gt;Is the model retrieving current sources or relying on training-data memory?&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;p class=&quot;laef-decision-line&quot;&gt;&lt;strong&gt;Layer 3 decision:&lt;/strong&gt; Use the output as a provisional aid, rerun under controlled variations, move outside the model, or stop using it for this task.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section class=&quot;laef-layer-detail&quot; aria-labelledby=&quot;laef-evaluation-record&quot;&gt;
          &lt;h3 id=&quot;laef-evaluation-record&quot;&gt;Keep an evaluation record for consequential work&lt;/h3&gt;
          &lt;p class=&quot;laef-lede&quot;&gt;For reproducible or high-stakes evaluation, document enough context for another person to understand what the system did and how you checked it.&lt;/p&gt;
          &lt;div class=&quot;laef-check-grid&quot;&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;Record the system&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Model, version, interface, and date&lt;/li&gt;
                &lt;li&gt;System instructions and exact prompts&lt;/li&gt;
                &lt;li&gt;Browsing, retrieval, or tool status&lt;/li&gt;
                &lt;li&gt;Relevant sampling or generation settings&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
            &lt;div class=&quot;laef-check-group&quot;&gt;
              &lt;h3&gt;Record the evaluation&lt;/h3&gt;
              &lt;ul&gt;
                &lt;li&gt;Repeated outputs and prompt variants&lt;/li&gt;
                &lt;li&gt;Comparison sources and search strategy&lt;/li&gt;
                &lt;li&gt;Observed uncertainty, bias, harm, or instability&lt;/li&gt;
                &lt;li&gt;Your final use, revision, rejection, or escalation decision&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;p class=&quot;laef-source-note&quot;&gt;Framework synthesis adapted from &lt;a href=&quot;https://app.notion.com/p/3b3d54312a4b811f87cfceccb619745d&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;AI Output Evaluation, Zotero Synthesis, and LAEF Three-Layer Mapping&lt;/a&gt;. The synthesis is based on bibliographic metadata, abstracts, and notes rather than a full-text systematic review.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;laef-panel&quot; id=&quot;laef-practice-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;laef-tab-practice&quot; data-active=&quot;false&quot; hidden&gt;
        &lt;h2&gt;Triage a real answer before verifying anything&lt;/h2&gt;
        &lt;p class=&quot;laef-lede&quot;&gt;Example prompt: “Is vaping an effective way to quit smoking—and how risky is it for teens?”&lt;/p&gt;
        &lt;section class=&quot;laef-section&quot;&gt;
          &lt;table class=&quot;laef-practice&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Claim&lt;/th&gt;&lt;th&gt;Stakes&lt;/th&gt;&lt;th&gt;Verifiability&lt;/th&gt;&lt;th&gt;Effort&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Vaping is an effective cessation aid.&lt;/td&gt;&lt;td&gt;High&lt;/td&gt;&lt;td&gt;Hard&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;laef-tag laef-tag-deep&quot;&gt;Deep audit&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;About 1.6 million U.S. teens currently vape.&lt;/td&gt;&lt;td&gt;Moderate&lt;/td&gt;&lt;td&gt;Easy&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;laef-tag laef-tag-quick&quot;&gt;Quick check&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Nicotine is a stimulant.&lt;/td&gt;&lt;td&gt;Low&lt;/td&gt;&lt;td&gt;Easy&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;laef-tag laef-tag-use&quot;&gt;Provisional use&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/section&gt;
      &lt;/section&gt;

      &lt;section class=&quot;laef-panel&quot; id=&quot;laef-resources&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;laef-tab-resources&quot; data-active=&quot;false&quot; hidden&gt;
        &lt;div class=&quot;laef-page-grid&quot;&gt;
          &lt;div class=&quot;laef-main&quot;&gt;
            &lt;h2&gt;Where to verify&lt;/h2&gt;
            &lt;p class=&quot;laef-lede&quot;&gt;Use databases and tools for source verification and cross-reference checks. Most are free or library-licensed.&lt;/p&gt;
            &lt;ul class=&quot;laef-resource-list laef-section&quot;&gt;
              &lt;li&gt;&lt;strong&gt;PubMed&lt;/strong&gt;&lt;span&gt;Start with biomedical literature.&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;Retraction Watch Database&lt;/strong&gt;&lt;span&gt;Check whether a paper has been retracted.&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;Ulrichsweb&lt;/strong&gt;&lt;span&gt;Check whether a journal is peer-reviewed and open access.&lt;/span&gt;&lt;/li&gt;
              &lt;li&gt;&lt;strong&gt;Cochrane Library · MedlinePlus&lt;/strong&gt;&lt;span&gt;Use systematic reviews and NIH or federal consensus for cross-reference.&lt;/span&gt;&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;aside class=&quot;laef-side&quot;&gt;
            &lt;div class=&quot;laef-side-box&quot;&gt;
              &lt;h2&gt;Verification reminders&lt;/h2&gt;
              &lt;ul&gt;
                &lt;li&gt;Verify widely; one index is not proof of fabrication.&lt;/li&gt;
                &lt;li&gt;Check what a source actually supports.&lt;/li&gt;
                &lt;li&gt;Verification is access-bounded.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/aside&gt;
        &lt;/div&gt;
      &lt;/section&gt;
    &lt;/main&gt;

    &lt;footer class=&quot;laef-footer&quot;&gt;&lt;span&gt;Research Skills Guide&lt;/span&gt;&lt;span&gt;AI evaluation workshop guide&lt;/span&gt;&lt;/footer&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;laef-libguide-mockup&#x27;);
    if (!root) return;
    const tabs = [...root.querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)];
    const panels = [...root.querySelectorAll(&#x27;[role=&quot;tabpanel&quot;]&#x27;)];

    function selectTab(tab) {
      tabs.forEach((candidate) =&gt; candidate.setAttribute(&#x27;aria-selected&#x27;, String(candidate === tab)));
      panels.forEach((panel) =&gt; {
        const active = panel.id === tab.dataset.panel;
        panel.hidden = !active;
        panel.dataset.active = String(active);
      });
    }

    tabs.forEach((tab, index) =&gt; {
      tab.addEventListener(&#x27;click&#x27;, () =&gt; selectTab(tab));
      tab.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key !== &#x27;ArrowRight&#x27; &amp;&amp; event.key !== &#x27;ArrowLeft&#x27;) return;
        event.preventDefault();
        const offset = event.key === &#x27;ArrowRight&#x27; ? 1 : -1;
        const next = tabs[(index + offset + tabs.length) % tabs.length];
        next.focus();
        selectTab(next);
      });
    });

  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
